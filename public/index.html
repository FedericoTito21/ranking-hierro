<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de Hierro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#121214; --surface:#1b1b1e; --surface2:#232327; --line:#2e2e33;
    --chalk:#EDEDE6; --muted:#93939b;
    --accent:#E8402C; --accent-dim:#5c211a;
    --t-novato:#6b7280; --t-intermedio:#4C8BF5; --t-avanzado:#34B27B; --t-elite:#E8402C; --t-top:#E3B341;
    font-family:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  .app{background:var(--bg);color:var(--chalk);min-height:100vh;padding:0 0 48px;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
  .hero{padding:28px 20px 22px;border-bottom:1px solid var(--line);background:
    linear-gradient(180deg, rgba(232,64,44,0.08), transparent 70%);}
  .hero h1{font-size:26px;font-weight:700;margin:0 0 4px;color:var(--chalk);}
  .hero .accent{color:var(--accent);}
  .hero p{margin:0;color:var(--muted);font-size:13.5px;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px;}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--chalk);
    padding:10px 11px;border-radius:7px;font-size:15px;font-family:'Inter',sans-serif;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  button{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:600;
    background:var(--accent);color:#fff;border:none;border-radius:7px;padding:12px 16px;font-size:14px;cursor:pointer;
    transition:filter .15s;}
  button:hover{filter:brightness(1.1);}
  button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  button.small{padding:7px 10px;font-size:12px;}
  .quickpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .quickpick button{background:var(--surface2);color:var(--chalk);border:1px solid var(--line);font-family:'Inter';
    text-transform:none;font-weight:500;letter-spacing:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
  .whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .whoami img{width:26px;height:26px;border-radius:50%;display:block;}
  .whoami b{color:var(--chalk);}
  .section-title{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:26px 0 8px;padding:0 2px;}
  .ex-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px;}
  .ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .ex-head h3{margin:0;font-size:15px;font-weight:600;color:var(--chalk);}
  .badge{font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .track{position:relative;height:10px;border-radius:6px;overflow:hidden;display:flex;margin-top:12px;background:var(--surface2);}
  .track .seg{height:100%;}
  .marker{position:absolute;top:-4px;width:3px;height:18px;background:var(--chalk);border-radius:2px;
    box-shadow:0 0 0 2px var(--bg);}
  .ex-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}
  .next-hint{font-size:12px;color:var(--muted);margin-top:8px;}
  .hist-del{background:none;border:none;color:var(--muted);font-size:15px;line-height:1;padding:2px 4px;
    cursor:pointer;flex-shrink:0;}
  .hist-del:hover{color:var(--accent);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-family:'Oswald',sans-serif;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);}
  td{padding:8px 6px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .you-row td{background:rgba(232,64,44,0.08);}
  .rank-row.you-row{background:rgba(232,64,44,0.08);border-radius:6px;}
  .pos{color:var(--muted);font-variant-numeric:tabular-nums;width:22px;}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px;}
  .footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding:0 2px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);
    border:1px solid var(--line);color:var(--chalk);padding:10px 16px;border-radius:8px;font-size:13px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:sp .7s linear infinite;margin:30px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .tabs{display:flex;gap:6px;margin-top:18px;}
  .tabs button{flex:1;background:var(--surface2);color:var(--muted);border:1px solid var(--line);
    font-family:'Oswald';text-transform:uppercase;font-size:12.5px;}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .rank-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{font-family:'Oswald';font-size:15px;color:var(--muted);width:20px;}
  .rank-name{flex:1;font-size:14px;font-weight:500;}
  .rank-avg{font-size:12px;color:var(--muted);}
  @media(max-width:420px){.hero h1{font-size:22px;}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;
    justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;
    max-width:340px;width:100%;}
  .modal-box h3{margin:0 0 10px;font-size:16px;color:var(--chalk);}
  .modal-box p{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.4;}
  .modal-box input{margin-bottom:4px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;}
  .subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:2px;-webkit-overflow-scrolling:touch;}
  .subtabs button{flex:0 0 auto;background:var(--surface2);color:var(--muted);border:1px solid var(--line);
    font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;
    padding:7px 13px;border-radius:20px;white-space:nowrap;}
  .subtabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chart-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
  .signin-card{text-align:center;padding:32px 20px;}
  .google-btn{background:#fff;color:#1f1f1f;display:inline-flex;align-items:center;gap:10px;
    padding:11px 20px;border-radius:8px;font-family:'Inter',sans-serif;text-transform:none;
    letter-spacing:0;font-weight:600;font-size:14.5px;border:1px solid #dadce0;}
  .google-btn:hover{filter:none;background:#f7f7f7;}
  .avatar{border-radius:50%;object-fit:cover;flex-shrink:0;display:block;}
  .avatar-fallback{border-radius:50%;background:var(--surface2);border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;font-weight:600;}
  .star-btn{background:none;border:none;color:var(--accent);font-size:17px;line-height:1;padding:0 2px;cursor:pointer;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .export-actions{display:flex;gap:10px;margin-top:10px;}
  .export-actions button{flex:1;}
  .ticker-wrap{overflow:hidden;white-space:nowrap;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:9px 0;margin-top:14px;position:relative;}
  .ticker-wrap::before{content:'EN VIVO';position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;
    padding:0 10px;background:var(--accent);color:#fff;font-family:'Oswald',sans-serif;font-size:10px;
    font-weight:700;letter-spacing:.06em;z-index:2;}
  .ticker-track{display:inline-block;padding-left:calc(100% + 90px);animation:ticker linear infinite;}
  .ticker-track span{margin-right:36px;font-size:12.5px;color:var(--chalk);}
  .ticker-empty{padding:9px 16px;font-size:12.5px;color:var(--muted);}
  @keyframes ticker{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
</style>
</head>
<body>

<div class="app" id="app">
  <div class="hero">
    <div class="wrap">
      <h1>Ranking de <span class="accent">Hierro</span></h1>
      <p>Comparad vuestra fuerza real, ajustada al peso corporal.</p>
    </div>
  </div>
  <div class="wrap" id="main">
    <div class="spin"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"></div>

// ---- Nivel Global del Usuario (NGU) ----
const NGU_TIERS = [
  {name:'Gatito', min:0.60, emoji:'🐱'},
  {name:'Lince', min:0.90, emoji:'🐈'},
  {name:'Puma', min:1.20, emoji:'🐆'},
  {name:'León', min:1.50, emoji:'🦁'},
  {name:'Tigre de Bengala', min:2.00, emoji:'🐯'}
];
const NGU_COLORS = ['#8a8f98','#5b8fb0','#b5651d','#e3b341','#e8402c'];
function nguTier(ngu){
  let idx=-1;
  NGU_TIERS.forEach((tier,i)=>{ if(ngu>=tier.min) idx=i; });
  return idx;
}
function computeNGU(uid){
  const bw = PROFILES[uid] && PROFILES[uid].bw;
  const ids = ['press_banca','sentadilla','peso_muerto','dominadas'];
  let sum=0, count=0, missing=[];
  if(!bw) return {ngu:null, count:0, missing: ids.map(id=>EXERCISES.find(e=>e.id===id).name)};
  ids.forEach(id=>{
    const ex = EXERCISES.find(e=>e.id===id);
    const b = bestLift(uid, id);
    if(!b){ missing.push(ex.name); return; }
    let r = b.ratio;
    if(ex.type==='bodyweight') r = r + 1; // "peso total levantado / peso corporal", no solo el añadido
    sum += r; count++;
  });
  return {ngu: count===4 ? sum/4 : null, count, missing};
}
function fmt2(n){ return (Math.round(n*100)/100).toString().replace('.',','); }
function computeIMC(uid){
  const p = PROFILES[uid];
  if(!p || !p.bw || !p.height) return null;
  const hM = p.height/100;
  return p.bw/(hM*hM);
}
function imcCategory(imc){
  if(imc==null) return null;
  if(imc<18.5) return 'Bajo peso';
  if(imc<25) return 'Normal';
  if(imc<30) return 'Sobrepeso';
  return 'Obesidad';
}
function avgWeight(uid, exId){
  const lifts = LIFTS.filter(l=>l.uid===uid && l.exercise===exId);
  if(!lifts.length) return null;
  return lifts.reduce((s,l)=>s+l.weight,0)/lifts.length;
}

function epley(w,r){ return r<=1 ? w : w*(1+r/30); }
function userRatio(ex, weight, reps, bw){
  if(ex.type==='weighted') return epley(weight,reps)/bw;
  if(ex.type==='absolute') return epley(weight,reps);
  if(ex.type==='time') return weight;
  const base = ex.base!=null ? ex.base : 1;
  return epley(base*bw+weight, reps)/bw - base;
}
function tierRatio(ex, tier){
  if(ex.type==='weighted') return epley(tier.mult, tier.reps);
  if(ex.type==='absolute') return epley(tier.weight, tier.reps);
  if(ex.type==='time') return tier.seconds;
  const base = ex.base!=null ? ex.base : 1;
  return epley(base+tier.added, tier.reps) - base;
}
function levelFor(ex, ratio){
  let idx=-1;
  ex.tiers.forEach((tier,i)=>{ if(ratio >= tierRatio(ex,tier)) idx=i; });
  return idx;
}
function maxScale(ex){ return tierRatio(ex, ex.tiers[4]) * 1.15; }
function tierSegments(ex, scale){
  const bounds = [0, ...ex.tiers.map(tier=>tierRatio(ex,tier)), scale];
  let html = '';
  for(let i=0;i<bounds.length-1;i++){
    const widthPct = Math.max(0, (bounds[i+1]-bounds[i])/scale*100);
    const color = i===0 ? 'transparent' : TIER_COLORS[i-1];
    html += `<div class="seg" style="width:${widthPct}%;background:${color};opacity:${i===0?0:0.55};"></div>`;
  }
  return html;
}
function fmt(n){ return (Math.round(n*10)/10).toString().replace('.',','); }
function ratioText(ex, ratio){
  if(ex.type==='absolute') return `${fmt(ratio)} kg`;
  if(ex.type==='time') return `${fmt(ratio)} s`;
  return fmt(ratio);
}
function liftText(ex, weight, reps){
  if(ex.type==='time') return `${fmt(weight)} s`;
  if(ex.type==='bodyweight') return `+${fmt(weight)} kg × ${reps}`;
  return `${fmt(weight)} kg × ${reps}`;
}
function fmtDateTime(ts){
  const d = new Date(ts);
  const date = d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'2-digit'});
  const time = d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  return `${date} · ${time}`;
}
function seriesFromEntries(ex, entries, fallbackBw){
  return entries.map(l=>({ts:l.ts, value:userRatio(ex, l.weight, l.reps, l.bw || fallbackBw)}));
}
function legendHTML(items){
  return `<div class="legend">${items.map(it=>`<span><i style="background:${it.color};"></i>${esc(it.label)}</span>`).join('')}</div>`;
}
function chartWithAxes(seriesList, opts){
  opts = opts || {};
  const formatY = opts.formatY || (v=>fmt(v));
  const allPoints = seriesList.flatMap(s=>s.points);
  const allTs = allPoints.map(p=>p.ts), allVals = allPoints.map(p=>p.value);
  const minTs = Math.min(...allTs), maxTs = Math.max(...allTs), tsRange = (maxTs-minTs) || 1;
  const minV = Math.min(...allVals), maxV = Math.max(...allVals), vRange = (maxV-minV) || 1;
  const w = 340, h = 180, padL = 40, padR = 12, padT = 12, padB = 26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  function toXY(p){
    const x = padL + ((p.ts-minTs)/tsRange)*plotW;
    const y = h-padB - ((p.value-minV)/vRange)*plotH;
    return {x,y};
  }
  const yTickCount = 4;
  let yGrid = '', yLabels = '';
  for(let i=0;i<=yTickCount;i++){
    const v = minV + (vRange*i/yTickCount);
    const y = h-padB - (i/yTickCount)*plotH;
    yGrid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,3"/>`;
    yLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${esc(formatY(v))}</text>`;
  }
  const xTickTs = [minTs, minTs+tsRange/2, maxTs];
  let xLabels = '';
  xTickTs.forEach(ts=>{
    const x = padL + ((ts-minTs)/tsRange)*plotW;
    const label = new Date(ts).toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit'});
    xLabels += `<text x="${x.toFixed(1)}" y="${h-padB+14}" text-anchor="middle" font-size="9" fill="var(--muted)">${label}</text>`;
  });
  const axisLines = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--muted)" stroke-width="1"/>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--muted)" stroke-width="1"/>`;
  let seriesSvg = '';
  seriesList.forEach(s=>{
    const pts = s.points.map(toXY);
    const lineStr = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${s.color}"/>`).join('');
    seriesSvg += `<polyline points="${lineStr}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dots}`;
  });
  const svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="190" preserveAspectRatio="xMidYMid meet">
    ${yGrid}${axisLines}${seriesSvg}${yLabels}${xLabels}
  </svg>`;
  return svg + legendHTML(seriesList.map(s=>({color:s.color, label:s.label})));
}
function progressChart(ex, sortedEntries, bw, label){
  const points = sortedEntries.map(l=>({ts:l.ts, value:userRatio(ex, l.weight, l.reps, l.bw || bw)}));
  return chartWithAxes([{points, color:'var(--accent)', label: label||'Tú'}], {formatY: v=>ratioText(ex, v)});
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function csvEscape(v){

function downloadBlob(content, mime, filename){

function computeFeed(limit){
  const sorted = [...LIFTS].sort((a,b)=>a.ts-b.ts);
  const bestByUserEx = {};
  const bestByEx = {};
  const events = [];
  sorted.forEach(l=>{
    const ex = EXERCISES.find(e=>e.id===l.exercise);
    if(!ex) return;
    const bw = l.bw || (PROFILES[l.uid] && PROFILES[l.uid].bw);
    if(!bw) return;
    const ratio = userRatio(ex, l.weight, l.reps, bw);
    const keyUserEx = `${l.uid}|${ex.id}`;
    const prevPersonalBest = bestByUserEx[keyUserEx];
    const prevLeader = bestByEx[ex.id];
    const isPR = (prevPersonalBest===undefined) || ratio > prevPersonalBest;
    let type = 'normal', extraUid = null;
    if(isPR && prevLeader && prevLeader.uid !== l.uid && ratio > prevLeader.ratio){
      type = 'overtake';
      extraUid = prevLeader.uid;
    } else if(isPR && prevPersonalBest !== undefined){
      type = 'pr';
    }
    events.push({ts:l.ts, uid:l.uid, ex, ratio, weight:l.weight, reps:l.reps, type, extraUid});
    if(isPR) bestByUserEx[keyUserEx] = ratio;
    if(!prevLeader || ratio > prevLeader.ratio) bestByEx[ex.id] = {uid:l.uid, ratio};
  });
  return events.reverse().slice(0, limit);
}
function feedText(ev){
  const name = esc(displayName(ev.uid));
  const liftTxt = liftText(ev.ex, ev.weight, ev.reps);
  if(ev.type==='overtake') return `👑 ${name} superó a ${esc(displayName(ev.extraUid))} en ${esc(ev.ex.name)} (${liftTxt})`;
  if(ev.type==='pr') return `🏅 ${name} batió su récord en ${esc(ev.ex.name)}: ${liftTxt}`;
  return `📋 ${name} registró ${liftTxt} en ${esc(ev.ex.name)}`;
}
function renderTicker(){
  const events = computeFeed(15);
  if(!events.length) return `<div class="ticker-wrap"><div class="ticker-empty">Aún no hay actividad reciente — ¡sé el primero en registrar una marca!</div></div>`;
  const items = events.map(ev=>`<span>${feedText(ev)}</span>`).join('');
  const duration = Math.max(20, events.length * 6);
  return `<div class="ticker-wrap"><div class="ticker-track" style="animation-duration:${duration}s;">${items}${items}</div></div>`;
}

function bestLift(uid, exId){
  const ex = EXERCISES.find(e=>e.id===exId);
  const lifts = LIFTS.filter(l=>l.uid===uid && l.exercise===exId);
  if(!lifts.length) return null;
  const bw = PROFILES[uid] && PROFILES[uid].bw;
  if(!bw) return null;
  let best = null, bestR = -Infinity;
  lifts.forEach(l=>{
    const r = userRatio(ex, l.weight, l.reps, l.bw || bw);
    if(r > bestR){ bestR = r; best = l; }
  });
  return {lift:best, ratio:bestR};
}

function renderPerfilTab(){
  const uid = currentUser.uid;
  const bw = PROFILES[uid].bw;
  const nguCard = (function(){
    const data = computeNGU(uid);
    if(data.count < 4){
      return `<div class="card">
        <h3 style="margin:0 0 6px;font-size:14px;">🏆 Nivel Global (NGU)</h3>
        <div class="empty">Te falta registrar: ${data.missing.join(', ')} para calcular tu NGU.</div>
      </div>`;
    }
    const idx = nguTier(data.ngu);
    const tier = idx>=0 ? NGU_TIERS[idx] : null;
    const color = idx>=0 ? NGU_COLORS[idx] : 'var(--muted)';
    const tierLabel = tier ? `${tier.emoji} ${tier.name}` : 'Sin clasificar';
    return `<div class="card">
      <div class="ex-head"><h3 style="margin:0;font-size:14px;">🏆 Nivel Global (NGU)</h3>
        <span class="badge" style="background:${color};color:#0d0d0e;">${tierLabel}</span></div>
      <div class="ex-meta" style="margin-top:8px;"><span>NGU = ${fmt2(data.ngu)}</span></div>
    </div>`;
  })();
  const cards = sortFavoritesFirst(filterByCategory(PERFIL_CAT), uid).map(ex=>{
    const isFav = ((PROFILES[uid].favorites)||[]).includes(ex.id);
    const starBtn = `<button class="star-btn" data-fav="${ex.id}" aria-label="Favorito" title="Marcar como favorito">${isFav?'★':'☆'}</button>`;
    const b = bestLift(uid, ex.id);
    const scale = maxScale(ex);
    const segs = tierSegments(ex, scale);
    let markerLeft = 0, badge='', metaRight='', hint='';
    if(b){
      markerLeft = Math.min(Math.max(b.ratio/scale,0),1)*100;
      const idx = levelFor(ex, b.ratio);
      const lvlName = idx>=0 ? TIER_NAMES[idx] : 'Sin clasificar';
      const lvlColor = idx>=0 ? TIER_COLORS[idx] : 'var(--muted)';
      badge = `<span class="badge" style="background:${lvlColor};color:#0d0d0e;">${lvlName}</span>`;
      const liftTxt = liftText(ex, b.lift.weight, b.lift.reps);
      metaRight = `${liftTxt} · ${ratioText(ex, b.ratio)}`;
      if(idx<4){
        const nt = ex.tiers[idx+1];
        const needRatio = tierRatio(ex, nt);
        if(ex.type==='weighted'){
          const need1RM = needRatio*bw;
          hint = `Para ${nt.name}: ~${fmt(need1RM)} kg${ex.perArm?' por brazo':''} estimados a 1 rep (e1RM).`;
        } else if(ex.type==='absolute'){
          hint = `Para ${nt.name}: ~${fmt(needRatio)} kg por brazo a 1 rep (e1RM).`;
        } else if(ex.type==='time'){
          hint = `Para ${nt.name}: aguanta ${fmt(needRatio)} segundos.`;
        } else {
          const base = ex.base!=null ? ex.base : 1;
          if(base !== 1){
            hint = `Para ${nt.name}: consigue ${nt.reps} repeticiones seguidas.`;
          } else {
            const needTotal = (needRatio+base)*bw;
            const needAdded = needTotal-bw;
            hint = `Para ${nt.name}: ~+${fmt(needAdded)} kg añadidos a 1 rep (e1RM).`;
          }
        }
      } else {
        hint = 'Nivel máximo alcanzado. Top Mundial.';
      }
    } else {
      badge = `<span class="badge" style="background:var(--surface2);color:var(--muted);">Sin marca</span>`;
      metaRight = 'Aún no has registrado nada';
    }
    return `
      <div class="ex-card">
        <div class="ex-head"><h3>${ex.name}</h3><div style="display:flex;align-items:center;gap:8px;">${starBtn}${badge}</div></div>
        <div class="track">${segs}<div class="marker" style="left:${markerLeft}%;"></div></div>
        <div class="ex-meta"><span>${metaRight}</span></div>
        ${hint?`<div class="next-hint">${hint}</div>`:''}
      </div>
    `;
  }).join('');
  return `<div class="section-title">Tu progreso</div>${nguCard}${categoryTabs('perfil', PERFIL_CAT)}${cards}`;
}

function renderHistorialTab(){
  const uid = currentUser.uid;
  const bw = PROFILES[uid].bw;
  if(!HIST_EX) HIST_EX = '__bw__';

  let html = `<div class="section-title">Historial por ejercicio</div>`;
  html += categoryTabs('hist', HIST_CAT);
  html += `<div class="subtabs">`;
  html += `<button data-hist-ex="__bw__" class="${HIST_EX==='__bw__'?'active':''}">Peso corporal</button>`;
  html += filterByCategory(HIST_CAT).map(e=>`<button data-hist-ex="${e.id}" class="${e.id===HIST_EX?'active':''}">${e.name}</button>`).join('');
  html += `</div>`;
  html += `<div class="card">`;

  if(HIST_EX==='__bw__'){
    const history = BW_HISTORY.filter(h=>h.uid===uid);
    const sortedAsc = [...history].sort((a,b)=>a.ts-b.ts);
    const sortedDesc = [...history].sort((a,b)=>b.ts-a.ts);
    if(!history.length){
      html += `<div class="empty">Aún no hay historial de peso corporal registrado.</div>`;
    } else {
      html += chartWithAxes([{points: sortedAsc.map(h=>({ts:h.ts, value:h.bw})), color:'var(--accent)', label:'Peso corporal'}], {formatY: v=>`${fmt(v)} kg`});
      html += `<div style="overflow-x:auto;margin-top:12px;"><table><tr><th>Fecha</th><th>Peso corporal</th><th></th></tr>`;
      sortedDesc.forEach(h=>{
        html += `<tr><td>${fmtDateTime(h.ts)}</td><td>${fmt(h.bw)} kg</td>
          <td><button class="hist-del" data-del-bw="${h.id}" aria-label="Borrar entrada" title="Borrar entrada">×</button></td></tr>`;
      });
      html += `</table></div>`;
    }
  } else {
    const ex = EXERCISES.find(e=>e.id===HIST_EX) || EXERCISES[0];
    const entries = LIFTS.filter(l=>l.uid===uid && l.exercise===ex.id);
    const sortedAsc = [...entries].sort((a,b)=>a.ts-b.ts);
    const sortedDesc = [...entries].sort((a,b)=>b.ts-a.ts);
    if(!entries.length){
      html += `<div class="empty">Aún no has registrado marcas de ${ex.name}.</div>`;
    } else {
      const compareOptions = Object.keys(PROFILES).filter(u=>u!==uid && bestLift(u, ex.id));
      html += `<div style="margin-bottom:10px;"><label>Comparar con</label>
        <select id="compareSelect"><option value="">Nadie</option>
        ${compareOptions.map(u=>`<option value="${u}" ${u===COMPARE_UID?'selected':''}>${esc(displayName(u))}</option>`).join('')}
        </select></div>`;

      if(COMPARE_UID && PROFILES[COMPARE_UID]){
        const friendEntries = LIFTS.filter(l=>l.uid===COMPARE_UID && l.exercise===ex.id).sort((a,b)=>a.ts-b.ts);
        if(friendEntries.length){
          const mySeries = seriesFromEntries(ex, sortedAsc, bw);
          const friendSeries = seriesFromEntries(ex, friendEntries, PROFILES[COMPARE_UID].bw);
          html += chartWithAxes([
            {points:mySeries, color:'var(--accent)', label:'Tú'},
            {points:friendSeries, color:'#4C8BF5', label:displayName(COMPARE_UID)}
          ], {formatY: v=>ratioText(ex, v)});
        } else {
          html += progressChart(ex, sortedAsc, bw);
          html += `<div class="empty" style="margin-top:6px;">${esc(displayName(COMPARE_UID))} no tiene marcas de este ejercicio.</div>`;
        }
      } else {
        html += progressChart(ex, sortedAsc, bw);
      }

      html += `<div style="overflow-x:auto;margin-top:12px;"><table><tr><th>Fecha</th><th>Peso corp.</th><th>Marca</th><th>Ratio</th><th>Nota</th><th></th></tr>`;
      sortedDesc.forEach(l=>{
        const entryBw = l.bw || bw;
        const r = userRatio(ex, l.weight, l.reps, entryBw);
        const liftTxt = liftText(ex, l.weight, l.reps);
        html += `<tr>
          <td>${fmtDateTime(l.ts)}</td>
          <td>${fmt(entryBw)} kg</td>
          <td>${liftTxt}</td>
          <td>${ratioText(ex, r)}</td>
          <td>${l.note ? esc(l.note) : '—'}</td>
          <td><button class="hist-del" data-del-entry="${l.id}" aria-label="Borrar entrada" title="Borrar entrada">×</button></td>
        </tr>`;
      });
      html += `</table></div>`;
    }
  }
  html += `</div>`;
  return html;
}

function renderProfileComparison(meUid, otherUid){
  const pMe = PROFILES[meUid], pOther = PROFILES[otherUid];
  const imcMe = computeIMC(meUid), imcOther = computeIMC(otherUid);
  const nguMe = computeNGU(meUid), nguOther = computeNGU(otherUid);
  let html = `<div class="section-title">Comparativa</div><div class="card">
    <div style="overflow-x:auto;"><table>
      <tr><th></th><th>Tú</th><th>${esc(pOther.name)}</th></tr>
      <tr><td>Peso corporal</td><td>${fmt(pMe.bw)} kg</td><td>${fmt(pOther.bw)} kg</td></tr>
      <tr><td>Altura</td><td>${pMe.height!=null?fmt(pMe.height)+' cm':'—'}</td><td>${pOther.height!=null?fmt(pOther.height)+' cm':'—'}</td></tr>
      <tr><td>IMC</td><td>${imcMe!=null?fmt2(imcMe):'—'}</td><td>${imcOther!=null?fmt2(imcOther):'—'}</td></tr>
      <tr><td>NGU</td><td>${nguMe.count===4?fmt2(nguMe.ngu):'—'}</td><td>${nguOther.count===4?fmt2(nguOther.ngu):'—'}</td></tr>
    </table></div>
  </div>`;

  const allExIds = new Set([
    ...LIFTS.filter(l=>l.uid===meUid).map(l=>l.exercise),
    ...LIFTS.filter(l=>l.uid===otherUid).map(l=>l.exercise)
  ]);
  const exList = EXERCISES.filter(ex=>allExIds.has(ex.id));
  html += `<div class="section-title">Por ejercicio</div><div class="card">`;
  if(!exList.length){
    html += `<div class="empty">Ninguno de los dos tiene marcas registradas.</div>`;
  } else {
    html += `<div style="overflow-x:auto;"><table><tr><th>Ejercicio</th><th>Tú</th><th>${esc(pOther.name)}</th></tr>`;
    exList.forEach(ex=>{
      const bMe = bestLift(meUid, ex.id);
      const bOther = bestLift(otherUid, ex.id);
      const meTxt = bMe ? `${liftText(ex,bMe.lift.weight,bMe.lift.reps)} (${ratioText(ex,bMe.ratio)})` : '—';
      const otherTxt = bOther ? `${liftText(ex,bOther.lift.weight,bOther.lift.reps)} (${ratioText(ex,bOther.ratio)})` : '—';
      const meAhead = bMe && (!bOther || bMe.ratio > bOther.ratio);
      const otherAhead = bOther && (!bMe || bOther.ratio > bMe.ratio);
      html += `<tr><td>${ex.name}</td>
        <td style="${meAhead?'color:var(--accent);font-weight:600;':''}">${meTxt}</td>
        <td style="${otherAhead?'color:var(--accent);font-weight:600;':''}">${otherTxt}</td></tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;
  return html;
}

function renderNguBoard(){
  const meUid = currentUser.uid;
  const all = Object.keys(PROFILES).map(uid=>({uid, data:computeNGU(uid)}));
  const ranked = all.filter(x=>x.data.count===4).map(x=>({uid:x.uid, ngu:x.data.ngu})).sort((a,b)=>b.ngu-a.ngu);
  let html = `<div class="section-title">🏆 Nivel Global (NGU)</div><div class="card">`;
  if(!ranked.length){
    html += `<div class="empty">Aún nadie tiene registrados los 4 ejercicios principales (Press banca, Sentadilla, Peso muerto, Dominadas).</div>`;
  } else {
    ranked.forEach((r,i)=>{
      const idx = nguTier(r.ngu);
      const tier = idx>=0 ? NGU_TIERS[idx] : null;
      const color = idx>=0 ? NGU_COLORS[idx] : 'var(--muted)';
      const label = tier ? `${tier.emoji} ${tier.name}` : 'Sin clasificar';
      html += `<div class="rank-row ${r.uid===meUid?'you-row':''}">${avatarHTML(r.uid,24)}<div class="rank-pos">${i+1}</div>
        <div class="rank-name" data-view-profile="${r.uid}" style="cursor:pointer;">${esc(displayName(r.uid))}</div>
        <div class="rank-avg">NGU ${fmt2(r.ngu)} · <span class="badge" style="background:${color};color:#0d0d0e;">${label}</span></div></div>`;
    });
  }
  html += `</div>`;
  return html;
}

function renderRankingTab(){
  const meUid = currentUser.uid;
  let html = renderNguBoard();
  html += `<div class="section-title">Por ejercicio</div>${categoryTabs('ranking', RANKING_CAT)}`;
  sortFavoritesFirst(filterByCategory(RANKING_CAT), meUid).forEach(ex=>{
    const rows = Object.keys(PROFILES).map(uid=>{
      const b = bestLift(uid, ex.id);
      if(!b) return null;
      const idx = levelFor(ex, b.ratio);
      return {uid, ratio:b.ratio, lift:b.lift, idx};
    }).filter(Boolean).sort((a,b)=>b.ratio-a.ratio);
    html += `<div class="card"><h3 style="margin:0 0 8px;font-size:14px;">${ex.name}</h3>`;
    if(!rows.length){
      html += `<div class="empty">Nadie ha registrado marca todavía.</div>`;
    } else {
      html += `<table><tr><th></th><th>Nombre</th><th>Marca</th><th>Nivel</th></tr>`;
      rows.forEach((r,i)=>{
        const liftTxt = liftText(ex, r.lift.weight, r.lift.reps);
        const lvlName = r.idx>=0?TIER_NAMES[r.idx]:'—';
        const lvlColor = r.idx>=0?TIER_COLORS[r.idx]:'var(--muted)';
        html += `<tr class="${r.uid===meUid?'you-row':''}"><td class="pos">${i+1}</td><td style="display:flex;align-items:center;gap:6px;cursor:pointer;" data-view-profile="${r.uid}">${avatarHTML(r.uid,20)}${esc(displayName(r.uid))}</td><td>${liftTxt}</td>
          <td><span class="badge" style="background:${lvlColor};color:#0d0d0e;">${lvlName}</span></td></tr>`;
      });
      html += `</table>`;
    }
    html += `</div>`;
  });

  html += `<div class="section-title">Clasificación general</div><div class="card">`;
  const general = Object.keys(PROFILES).map(uid=>{
    let sum=0, count=0, normSum=0;
    EXERCISES.forEach(ex=>{
      const b = bestLift(uid, ex.id);
      if(b){
        sum += (levelFor(ex,b.ratio)+1);
        normSum += Math.min(Math.max(b.ratio/maxScale(ex), 0), 1);
        count++;
      }
    });
    return {uid, avg: count? sum/count : 0, count, normAvg: count? normSum/count : 0};
  }).filter(g=>g.count>0).sort((a,b)=>b.avg-a.avg || b.count-a.count || b.normAvg-a.normAvg);
  if(!general.length){
    html += `<div class="empty">Aún no hay marcas registradas por nadie.</div>`;
  } else {
    general.forEach((g,i)=>{
      html += `<div class="rank-row ${g.uid===meUid?'you-row':''}">${avatarHTML(g.uid,24)}<div class="rank-pos">${i+1}</div>
        <div class="rank-name" data-view-profile="${g.uid}" style="cursor:pointer;">${esc(displayName(g.uid))}</div>
        <div class="rank-avg">Nivel medio ${fmt(g.avg)}/5 · ${g.count} ejerc. · ${fmt(g.normAvg*100)}% progreso medio</div></div>`;
    });
  }
  html += `</div>`;
  return html;
}

function bindDashboard(){
  const exSelect = document.getElementById('exSelect');
  const weightLabel = document.getElementById('weightLabel');
  const repsGroup = document.getElementById('repsGroup');
  function updateLabel(){
    const ex = EXERCISES.find(e=>e.id===exSelect.value);
    repsGroup.style.display = ex.hideReps ? 'none' : '';
    if(ex.inputLabel){ weightLabel.textContent = ex.inputLabel; return; }
    weightLabel.textContent = ex.type==='bodyweight' ? 'Peso añadido (kg, 0 si es a peso corporal)' : 'Peso levantado (kg)';
  }
  exSelect.addEventListener('change', updateLabel);
  updateLabel();

  document.getElementById('saveLiftBtn').addEventListener('click', async ()=>{
    const exId = exSelect.value;
    const ex = EXERCISES.find(e=>e.id===exId);
    const weight = parseFloat(document.getElementById('weightInput').value);
    const reps = ex.hideReps ? 1 : parseInt(document.getElementById('repsInput').value);
    const note = document.getElementById('noteInput').value.trim();
    if(isNaN(weight) || weight<0){ toast('Introduce un peso válido.'); return; }
    if(!reps || reps<1){ toast('Introduce las repeticiones.'); return; }
    try{
      await saveLift(exId, weight, reps, note);
      document.getElementById('weightInput').value='';
      document.getElementById('repsInput').value='';
      document.getElementById('noteInput').value='';
      toast('Marca guardada.');
    }catch(e){ console.error(e); toast('Error al guardar la marca.'); }
  });

  document.getElementById('changePhotoBtn').addEventListener('click', async ()=>{
    const cur = PROFILES[currentUser.uid].photoURL || '';
    const res = await showModal({title:'Cambiar foto', message:'Pega el enlace directo a una imagen (debe empezar por http:// o https://).', showInput:true, inputType:'text', inputLabel:'URL de la imagen', inputValue:cur, confirmText:'Guardar'});
    if(!res.confirmed) return;
    const url = (res.value||'').trim();
    if(url && !/^https?:\/\//.test(url)){ toast('La URL debe empezar por http:// o https://'); return; }
    try{ await updatePhoto(url); }catch(e){ console.error(e); toast('Error al actualizar la foto.'); }
  });

  document.getElementById('exportCsvBtn').addEventListener('click', ()=>{
    if(!LIFTS.some(l=>l.uid===currentUser.uid)){ toast('Aún no tienes marcas para exportar.'); return; }
    exportCSV();
  });
  document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
    if(!LIFTS.some(l=>l.uid===currentUser.uid)){ toast('Aún no tienes marcas para exportar.'); return; }
    exportPDF();
  });

  document.getElementById('signOutBtn').addEventListener('click', ()=> auth.signOut());

  document.getElementById('editBw').addEventListener('click', openEditProfileModal);

  document.getElementById('clearMine').addEventListener('click', async ()=>{
    const res = await showModal({title:'Borrar tus marcas', message:'¿Seguro que quieres borrar todas tus marcas registradas? Esta acción no se puede deshacer.', confirmText:'Borrar'});
    if(!res.confirmed) return;
    try{ await clearMyLifts(); }catch(e){ console.error(e); toast('Error al borrar tus marcas.'); }
  });

  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{
      TAB = b.dataset.tab;
      render();
    });
  });

  renderTabContent();
}

function renderTabContent(){
  const html = TAB==='perfil' ? renderPerfilTab() : TAB==='ranking' ? renderRankingTab() : renderHistorialTab();
  document.getElementById('tabContent').innerHTML = html;

  document.querySelectorAll('[data-view-profile]').forEach(el=>{
    el.addEventListener('click', ()=>{
      VIEW_PROFILE_UID = el.dataset.viewProfile;
      COMPARE_PROFILE_ACTIVE = false;
      render();
    });
  });

  document.querySelectorAll('[data-del-entry]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const res = await showModal({title:'Borrar entrada', message:'¿Borrar esta entrada del historial? Esta acción no se puede deshacer.', confirmText:'Borrar'});
      if(!res.confirmed) return;
      try{ await deleteLift(b.dataset.delEntry); }catch(e){ console.error(e); toast('Error al borrar la entrada.'); }
    });
  });

  document.querySelectorAll('[data-hist-ex]').forEach(b=>{
    b.addEventListener('click', ()=>{
      HIST_EX = b.dataset.histEx;
      COMPARE_UID = null;
      renderTabContent();
    });
  });

  const compareSelect = document.getElementById('compareSelect');
  if(compareSelect){
    compareSelect.addEventListener('change', ()=>{
      COMPARE_UID = compareSelect.value || null;
      renderTabContent();
    });
  }

  document.querySelectorAll('[data-fav]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      try{ await toggleFavorite(b.dataset.fav); }catch(err){ console.error(err); toast('Error al actualizar favorito.'); }
    });
  });

  document.querySelectorAll('[data-del-bw]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const res = await showModal({title:'Borrar entrada', message:'¿Borrar este registro de peso corporal? Esta acción no se puede deshacer.', confirmText:'Borrar'});
      if(!res.confirmed) return;
      try{ await deleteBwEntry(b.dataset.delBw); }catch(e){ console.error(e); toast('Error al borrar la entrada.'); }
    });
  });

  document.querySelectorAll('[data-cat]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [scope, cat] = b.dataset.cat.split(':');
      if(scope==='perfil') PERFIL_CAT = cat;
      if(scope==='ranking') RANKING_CAT = cat;
      if(scope==='hist') HIST_CAT = cat;
      renderTabContent();
    });
  });
}

function openEditProfileModal(){
  const overlay = document.getElementById('modalOverlay');
  const p = PROFILES[currentUser.uid];
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Editar perfil</h3>
      <label>Peso corporal (kg)</label>
      <input type="number" step="0.1" id="editBwInput" value="${p.bw}" />
      <div style="margin-top:10px;">
        <label>Altura (cm)</label>
        <input type="number" step="0.5" id="editHeightInput" value="${p.height!=null?p.height:''}" placeholder="Ej: 178" />
      </div>
      <div style="margin-top:10px;">
        <label>Sexo</label>
        <select id="editSexInput">
          <option value="">Prefiero no decirlo</option>
          <option value="Hombre" ${p.sex==='Hombre'?'selected':''}>Hombre</option>
          <option value="Mujer" ${p.sex==='Mujer'?'selected':''}>Mujer</option>
          <option value="Otro" ${p.sex==='Otro'?'selected':''}>Otro</option>
        </select>
      </div>
      <div class="empty" id="editProfileErr" style="margin-top:6px;"></div>
      <div class="modal-actions">
        <button class="ghost" id="editProfileCancel">Cancelar</button>
        <button id="editProfileSave">Guardar</button>
      </div>
    </div>
  `;
  overlay.classList.add('show');
  function close(){ overlay.classList.remove('show'); overlay.innerHTML=''; }
  document.getElementById('editProfileCancel').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); }, {once:true});
  document.getElementById('editProfileSave').addEventListener('click', async ()=>{
    const err = document.getElementById('editProfileErr');
    const n = parseFloat(document.getElementById('editBwInput').value);
    const h = parseFloat(document.getElementById('editHeightInput').value);
    const sex = document.getElementById('editSexInput').value;
    if(!n || n<=0){ err.textContent = 'Peso no válido.'; return; }
    try{
      await updateProfileDetails(n, isNaN(h)?null:h, sex);
      close();
      toast('Perfil actualizado.');
    }catch(e){ console.error(e); err.textContent = 'Error al guardar.'; }
  });
}

function showModal(opts){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${esc(opts.title||'')}</h3>
        ${opts.message?`<p>${esc(opts.message)}</p>`:''}
        ${opts.showInput?`<label>${esc(opts.inputLabel||'')}</label><input id="modalInput" type="${opts.inputType||'text'}" step="${opts.inputStep||'any'}" value="${opts.inputValue!=null?esc(String(opts.inputValue)):''}" />`:''}
        <div class="modal-actions">
          <button class="ghost" id="modalCancel">${esc(opts.cancelText||'Cancelar')}</button>
          <button id="modalConfirm">${esc(opts.confirmText||'Aceptar')}</button>
        </div>
      </div>
    `;
    overlay.classList.add('show');
    const input = document.getElementById('modalInput');
    if(input){ input.focus(); input.select(); }
    function cleanup(result){
      overlay.classList.remove('show');
      overlay.innerHTML = '';
      resolve(result);
    }
    document.getElementById('modalCancel').addEventListener('click', ()=>cleanup({confirmed:false}));
    document.getElementById('modalConfirm').addEventListener('click', ()=>{
      cleanup({confirmed:true, value: input ? input.value : null});
    });
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup({confirmed:false}); }, {once:true});
    if(input){
      input.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); document.getElementById('modalConfirm').click(); }
      });
    }
  });
}

render();

})();
</script>
