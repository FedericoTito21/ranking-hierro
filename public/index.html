<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ranking de Hierro</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#121214; --surface:#1b1b1e; --surface2:#232327; --line:#2e2e33;
    --chalk:#EDEDE6; --muted:#93939b;
    --accent:#E8402C; --accent-dim:#5c211a;
    --t-novato:#6b7280; --t-intermedio:#4C8BF5; --t-avanzado:#34B27B; --t-elite:#E8402C; --t-top:#E3B341;
    font-family:'Inter',sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);}
  .app{background:var(--bg);color:var(--chalk);min-height:100vh;padding:0 0 48px;}
  h1,h2,h3,.disp{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:0.03em;}
  .hero{padding:28px 20px 22px;border-bottom:1px solid var(--line);background:
    linear-gradient(180deg, rgba(232,64,44,0.08), transparent 70%);}
  .hero h1{font-size:26px;font-weight:700;margin:0 0 4px;color:var(--chalk);}
  .hero .accent{color:var(--accent);}
  .hero p{margin:0;color:var(--muted);font-size:13.5px;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;margin-top:16px;}
  label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px;text-transform:uppercase;letter-spacing:.04em;font-weight:600;}
  input,select{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--chalk);
    padding:10px 11px;border-radius:7px;font-size:15px;font-family:'Inter',sans-serif;}
  input:focus,select:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent);}
  .row{display:flex;gap:10px;}
  .row > *{flex:1;}
  button{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em;font-weight:600;
    background:var(--accent);color:#fff;border:none;border-radius:7px;padding:12px 16px;font-size:14px;cursor:pointer;
    transition:filter .15s;}
  button:hover{filter:brightness(1.1);}
  button:focus-visible{outline:2px solid var(--chalk);outline-offset:2px;}
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  button.small{padding:7px 10px;font-size:12px;}
  .quickpick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;}
  .quickpick button{background:var(--surface2);color:var(--chalk);border:1px solid var(--line);font-family:'Inter';
    text-transform:none;font-weight:500;letter-spacing:0;}
  .topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px;}
  .whoami{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);}
  .whoami img{width:26px;height:26px;border-radius:50%;display:block;}
  .whoami b{color:var(--chalk);}
  .section-title{font-size:13px;color:var(--muted);letter-spacing:.08em;margin:26px 0 8px;padding:0 2px;}
  .ex-card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-top:10px;}
  .ex-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .ex-head h3{margin:0;font-size:15px;font-weight:600;color:var(--chalk);}
  .badge{font-family:'Oswald',sans-serif;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
    padding:3px 9px;border-radius:20px;font-weight:600;white-space:nowrap;}
  .track{position:relative;height:10px;border-radius:6px;overflow:hidden;display:flex;margin-top:12px;background:var(--surface2);}
  .track .seg{height:100%;}
  .marker{position:absolute;top:-4px;width:3px;height:18px;background:var(--chalk);border-radius:2px;
    box-shadow:0 0 0 2px var(--bg);}
  .ex-meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px;}
  .next-hint{font-size:12px;color:var(--muted);margin-top:8px;}
  .hist-del{background:none;border:none;color:var(--muted);font-size:15px;line-height:1;padding:2px 4px;
    cursor:pointer;flex-shrink:0;}
  .hist-del:hover{color:var(--accent);}
  .hist-toggle{background:none;border:none;color:var(--accent);font-family:'Inter',sans-serif;
    text-transform:none;letter-spacing:0;font-weight:600;font-size:12.5px;padding:9px 0 0;cursor:pointer;}
  .hist-toggle:hover{filter:none;text-decoration:underline;}
  .hist-list{margin-top:10px;border-top:1px solid var(--line);padding-top:8px;}
  .hist-row{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12.5px;}
  .hd-lift{flex:1;}
  .hist-empty{color:var(--muted);font-size:12.5px;padding:4px 0;}
  .reaction-btn{background:var(--surface2);border:1px solid var(--line);border-radius:16px;
    padding:5px 10px;font-size:14px;line-height:1;cursor:pointer;font-family:'Inter',sans-serif;color:var(--chalk);}
  .reaction-btn.active{background:var(--accent-dim);border-color:var(--accent);}
  .reaction-btn:hover{filter:brightness(1.15);}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-family:'Oswald',sans-serif;font-size:11px;color:var(--muted);text-transform:uppercase;
    letter-spacing:.05em;font-weight:600;padding:6px 6px;border-bottom:1px solid var(--line);}
  td{padding:8px 6px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  .you-row td{background:rgba(232,64,44,0.08);}
  .rank-row.you-row{background:rgba(232,64,44,0.08);border-radius:6px;}
  .pos{color:var(--muted);font-variant-numeric:tabular-nums;width:22px;}
  .empty{color:var(--muted);font-size:13px;padding:8px 2px;}
  .footer-actions{display:flex;justify-content:space-between;align-items:center;margin-top:26px;padding:0 2px;}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--surface2);
    border:1px solid var(--line);color:var(--chalk);padding:10px 16px;border-radius:8px;font-size:13px;
    opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;}
  .toast.show{opacity:1;}
  .spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;
    animation:sp .7s linear infinite;margin:30px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
  .tabs{display:flex;gap:6px;margin-top:18px;}
  .tabs button{flex:1;background:var(--surface2);color:var(--muted);border:1px solid var(--line);
    font-family:'Oswald';text-transform:uppercase;font-size:12.5px;}
  .tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .rank-row{display:flex;align-items:center;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line);}
  .rank-row:last-child{border-bottom:none;}
  .rank-pos{font-family:'Oswald';font-size:15px;color:var(--muted);width:20px;}
  .rank-name{flex:1;font-size:14px;font-weight:500;}
  .rank-avg{font-size:12px;color:var(--muted);}
  @media(max-width:420px){.hero h1{font-size:22px;}}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;
    justify-content:center;z-index:100;padding:20px;}
  .modal-overlay.show{display:flex;}
  .modal-box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px;
    max-width:340px;width:100%;}
  .modal-box h3{margin:0 0 10px;font-size:16px;color:var(--chalk);}
  .modal-box p{margin:0 0 14px;font-size:13.5px;color:var(--muted);line-height:1.4;}
  .modal-box input{margin-bottom:4px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-actions button{flex:1;}
  .subtabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-top:2px;-webkit-overflow-scrolling:touch;}
  .subtabs button{flex:0 0 auto;background:var(--surface2);color:var(--muted);border:1px solid var(--line);
    font-family:'Inter',sans-serif;text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:500;
    padding:7px 13px;border-radius:20px;white-space:nowrap;}
  .subtabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .chart-caption{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:4px;}
  .signin-card{text-align:center;padding:32px 20px;}
  .google-btn{background:#fff;color:#1f1f1f;display:inline-flex;align-items:center;gap:10px;
    padding:11px 20px;border-radius:8px;font-family:'Inter',sans-serif;text-transform:none;
    letter-spacing:0;font-weight:600;font-size:14.5px;border:1px solid #dadce0;}
  .google-btn:hover{filter:none;background:#f7f7f7;}
  .medal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.78);display:none;align-items:center;
    justify-content:center;z-index:200;padding:20px;cursor:pointer;}
  .medal-overlay.show{display:flex;}
  .medal-pop{background:linear-gradient(160deg,#2a2410,#1b1b1e);border:2px solid #E3B341;border-radius:16px;
    padding:34px 28px;text-align:center;max-width:280px;animation:medalIn .55s cubic-bezier(.34,1.56,.64,1);
    box-shadow:0 0 40px rgba(227,179,65,0.35);}
  .medal-pop .medal-icon{font-size:64px;line-height:1;display:inline-block;animation:medalSpin .7s ease-out;}
  .medal-pop h3{font-family:'Oswald',sans-serif;color:#E3B341;margin:16px 0 6px;font-size:13px;
    letter-spacing:.08em;text-transform:uppercase;font-weight:700;}
  .medal-pop .medal-name{font-size:20px;font-weight:700;color:var(--chalk);margin:0 0 8px;font-family:'Oswald',sans-serif;}
  .medal-pop .medal-desc{font-size:13px;color:var(--muted);}
  @keyframes medalIn{0%{transform:scale(0.3) translateY(30px);opacity:0;}60%{transform:scale(1.08);opacity:1;}100%{transform:scale(1);}}
  @keyframes medalSpin{0%{transform:rotate(-25deg) scale(0.4);}100%{transform:rotate(0) scale(1);}}
  .medal-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);}
  .medal-row:last-child{border-bottom:none;}
  .medal-row .medal-emoji{font-size:22px;flex-shrink:0;width:26px;text-align:center;}
  .cal-nav{background:var(--surface2);border:1px solid var(--line);color:var(--chalk);border-radius:6px;
    width:26px;height:26px;font-size:15px;line-height:1;cursor:pointer;padding:0;}
  .cal-month-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
  .cal-daylabel{font-size:10px;color:var(--muted);text-align:center;font-family:'Oswald',sans-serif;
    text-transform:uppercase;padding-bottom:2px;}
  .cal-daycell{aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
    font-size:11px;color:var(--chalk);}
  .cal-daycell.empty{background:transparent;}
  .cal-daycell.today{box-shadow:0 0 0 2px var(--accent) inset;}
  .avatar{border-radius:50%;object-fit:cover;flex-shrink:0;display:block;}
  .avatar-fallback{border-radius:50%;background:var(--surface2);border:1px solid var(--line);
    display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex-shrink:0;font-weight:600;}
  .star-btn{background:none;border:none;color:var(--accent);font-size:17px;line-height:1;padding:0 2px;cursor:pointer;}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .legend i{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .export-actions{display:flex;gap:10px;margin-top:10px;}
  .export-actions button{flex:1;}
  .ticker-wrap{overflow:hidden;white-space:nowrap;background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:9px 0;margin-top:14px;position:relative;}
  .ticker-wrap::before{content:'EN VIVO';position:absolute;left:0;top:0;bottom:0;display:flex;align-items:center;
    padding:0 10px;background:var(--accent);color:#fff;font-family:'Oswald',sans-serif;font-size:10px;
    font-weight:700;letter-spacing:.06em;z-index:2;}
  .ticker-track{display:inline-block;padding-left:calc(100% + 90px);animation:ticker linear infinite;}
  .ticker-track span{margin-right:36px;font-size:12.5px;color:var(--chalk);}
  .ticker-empty{padding:9px 16px;font-size:12.5px;color:var(--muted);}
  @keyframes ticker{ from{transform:translateX(0);} to{transform:translateX(-50%);} }
</style>
</head>
<body>

</div>
<div class="toast" id="toast"></div>
<div class="modal-overlay" id="modalOverlay"></div>
<div class="medal-overlay" id="medalOverlay"></div>

// ---- Nivel Global del Usuario (NGU) ----
const NGU_TIERS = [
  {name:'Gatito', min:0.60, emoji:'🐱'},
  {name:'Lince', min:0.90, emoji:'🐈'},
  {name:'Puma', min:1.20, emoji:'🐆'},
  {name:'León', min:1.50, emoji:'🦁'},
  {name:'Tigre de Bengala', min:2.00, emoji:'🐯'}
];
const NGU_COLORS = ['#8a8f98','#5b8fb0','#b5651d','#e3b341','#e8402c'];
function nguTier(ngu){
  let idx=-1;
  NGU_TIERS.forEach((tier,i)=>{ if(ngu>=tier.min) idx=i; });
  return idx;
}
function computeNGU(uid){
  const bw = PROFILES[uid] && PROFILES[uid].bw;
  const ids = ['press_banca','sentadilla','peso_muerto','dominadas'];
  let sum=0, count=0, missing=[];
  if(!bw) return {ngu:null, count:0, missing: ids.map(id=>EXERCISES.find(e=>e.id===id).name)};
  ids.forEach(id=>{
    const ex = EXERCISES.find(e=>e.id===id);
    const b = bestLift(uid, id);
    if(!b){ missing.push(ex.name); return; }
    let r = b.ratio;
    if(ex.type==='bodyweight') r = r + 1; // "peso total levantado / peso corporal", no solo el añadido
    sum += r; count++;
  });
  return {ngu: count===4 ? sum/4 : null, count, missing};
}
function fmt2(n){ return (Math.round(n*100)/100).toString().replace('.',','); }
function computeIMC(uid){
  const p = PROFILES[uid];
  if(!p || !p.bw || !p.height) return null;
  const hM = p.height/100;
  return p.bw/(hM*hM);
}
function imcCategory(imc){
  if(imc==null) return null;
  if(imc<18.5) return 'Bajo peso';
  if(imc<25) return 'Normal';
  if(imc<30) return 'Sobrepeso';
  return 'Obesidad';
}
function avgWeight(uid, exId){
  const lifts = LIFTS.filter(l=>l.uid===uid && l.exercise===exId);
  if(!lifts.length) return null;
  return lifts.reduce((s,l)=>s+l.weight,0)/lifts.length;
}

function epley(w,r){ return r<=1 ? w : w*(1+r/30); }
function baseFor(ex, sex){
  if(sex==='Mujer' && ex.baseF!=null) return ex.baseF;
  return ex.base!=null ? ex.base : 1;
}
function userRatio(ex, weight, reps, bw, sex){
  if(ex.type==='weighted') return epley(weight,reps)/bw;
  if(ex.type==='absolute') return epley(weight,reps);
  if(ex.type==='time') return weight;
  const base = baseFor(ex, sex);
  return epley(base*bw+weight, reps)/bw - base;
}
function tierRatio(ex, tier, sex){
  if(ex.type==='weighted') return epley(tier.mult, tier.reps);
  if(ex.type==='absolute') return epley(tier.weight, tier.reps);
  if(ex.type==='time') return tier.seconds;
  const base = baseFor(ex, sex);
  return epley(base+tier.added, tier.reps) - base;
}
function tiersFor(ex, sex){
  return (sex==='Mujer' && ex.tiersF) ? ex.tiersF : ex.tiers;
}
function levelFor(ex, ratio, sex){
  let idx = ratio>=0 ? 0 : -1;
  tiersFor(ex,sex).forEach((tier,i)=>{ if(ratio >= tierRatio(ex,tier,sex)) idx=i; });
  return idx;
}
function maxScale(ex, sex){ return tierRatio(ex, tiersFor(ex,sex)[4], sex) * 1.15; }
function tierSegments(ex, scale, sex){
  const bounds = [0, ...tiersFor(ex,sex).map(tier=>tierRatio(ex,tier,sex)), scale];
  let html = '';
  for(let i=0;i<bounds.length-1;i++){
    const widthPct = Math.max(0, (bounds[i+1]-bounds[i])/scale*100);
    const color = TIER_COLORS[Math.max(0,i-1)];
    html += `<div class="seg" style="width:${widthPct}%;background:${color};opacity:0.55;"></div>`;
  }
  return html;
}
function fmt(n){ return (Math.round(n*10)/10).toString().replace('.',','); }
function ratioText(ex, ratio){
  if(ex.type==='absolute') return `${fmt(ratio)} kg`;
  if(ex.type==='time') return `${fmt(ratio)} s`;
  return fmt(ratio);
}
function liftText(ex, weight, reps){
  if(ex.type==='time') return `${fmt(weight)} s`;
  if(ex.type==='bodyweight') return `+${fmt(weight)} kg × ${reps}`;
  return `${fmt(weight)} kg × ${reps}`;
}
function fmtDateTime(ts){
  const d = new Date(ts);
  const date = d.toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit', year:'2-digit'});
  const time = d.toLocaleTimeString('es-ES', {hour:'2-digit', minute:'2-digit'});
  return `${date} · ${time}`;
}
function seriesFromEntries(ex, entries, fallbackBw, sex){
  return entries.map(l=>({ts:l.ts, value:userRatio(ex, l.weight, l.reps, l.bw || fallbackBw, sex)}));
}
function legendHTML(items){
  return `<div class="legend">${items.map(it=>`<span><i style="background:${it.color};"></i>${esc(it.label)}</span>`).join('')}</div>`;
}
function chartWithAxes(seriesList, opts){
  opts = opts || {};
  const formatY = opts.formatY || (v=>fmt(v));
  const allPoints = seriesList.flatMap(s=>s.points);
  const allTs = allPoints.map(p=>p.ts), allVals = allPoints.map(p=>p.value);
  const minTs = Math.min(...allTs), maxTs = Math.max(...allTs), tsRange = (maxTs-minTs) || 1;
  const minV = Math.min(...allVals), maxV = Math.max(...allVals), vRange = (maxV-minV) || 1;
  const w = 340, h = 180, padL = 40, padR = 12, padT = 12, padB = 26;
  const plotW = w-padL-padR, plotH = h-padT-padB;
  function toXY(p){
    const x = padL + ((p.ts-minTs)/tsRange)*plotW;
    const y = h-padB - ((p.value-minV)/vRange)*plotH;
    return {x,y};
  }
  const yTickCount = 4;
  let yGrid = '', yLabels = '';
  for(let i=0;i<=yTickCount;i++){
    const v = minV + (vRange*i/yTickCount);
    const y = h-padB - (i/yTickCount)*plotH;
    yGrid += `<line x1="${padL}" y1="${y.toFixed(1)}" x2="${w-padR}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,3"/>`;
    yLabels += `<text x="${padL-6}" y="${(y+3).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--muted)">${esc(formatY(v))}</text>`;
  }
  const xTickTs = [minTs, minTs+tsRange/2, maxTs];
  let xLabels = '';
  xTickTs.forEach(ts=>{
    const x = padL + ((ts-minTs)/tsRange)*plotW;
    const label = new Date(ts).toLocaleDateString('es-ES', {day:'2-digit', month:'2-digit'});
    xLabels += `<text x="${x.toFixed(1)}" y="${h-padB+14}" text-anchor="middle" font-size="9" fill="var(--muted)">${label}</text>`;
  });
  const axisLines = `<line x1="${padL}" y1="${padT}" x2="${padL}" y2="${h-padB}" stroke="var(--muted)" stroke-width="1"/>
    <line x1="${padL}" y1="${h-padB}" x2="${w-padR}" y2="${h-padB}" stroke="var(--muted)" stroke-width="1"/>`;
  let seriesSvg = '';
  seriesList.forEach(s=>{
    const pts = s.points.map(toXY);
    const lineStr = pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(' ');
    const dots = pts.map(p=>`<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="3" fill="${s.color}"/>`).join('');
    seriesSvg += `<polyline points="${lineStr}" fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>${dots}`;
  });
  const svg = `<svg viewBox="0 0 ${w} ${h}" width="100%" height="190" preserveAspectRatio="xMidYMid meet">
    ${yGrid}${axisLines}${seriesSvg}${yLabels}${xLabels}
  </svg>`;
  return svg + legendHTML(seriesList.map(s=>({color:s.color, label:s.label})));
}
function progressChart(ex, sortedEntries, bw, label, sex){
  const points = sortedEntries.map(l=>({ts:l.ts, value:userRatio(ex, l.weight, l.reps, l.bw || bw, sex)}));
  return chartWithAxes([{points, color:'var(--accent)', label: label||'Tú'}], {formatY: v=>ratioText(ex, v)});
}
function esc(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function displayName(uid){ return (PROFILES[uid] && PROFILES[uid].name) || 'Usuario'; }

    profilesLoaded = true;
    render();
  }, err=>{ console.error(err); toast('Error leyendo perfiles.'); }));

  unsubs.push(db.collection('lifts').onSnapshot(snap=>{
    LIFTS = snap.docs.map(d=>({id:d.id, ...d.data()}));
    checkAndAwardMedals();
    render();
  }, err=>{ console.error(err); toast('Error leyendo marcas.'); }));

  unsubs.push(db.collection('bwHistory').onSnapshot(snap=>{
    BW_HISTORY = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{ console.error(err); toast('Error leyendo historial de peso.'); }));

  unsubs.push(db.collection('reactions').onSnapshot(snap=>{
    REACTIONS = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{ console.error(err); toast('Error leyendo reacciones.'); }));

  unsubs.push(db.collection('comments').onSnapshot(snap=>{
    COMMENTS = snap.docs.map(d=>({id:d.id, ...d.data()}));
    render();
  }, err=>{ console.error(err); toast('Error leyendo comentarios.'); }));

  unsubs.push(db.collection('medals').onSnapshot(snap=>{
    const next = snap.docs.map(d=>({id:d.id, ...d.data()}));
    if(seenMedalDocIds===null){
      seenMedalDocIds = new Set(next.map(m=>m.id));
    } else {
      next.forEach(m=>{
        if(!seenMedalDocIds.has(m.id)){
          seenMedalDocIds.add(m.id);
          if(currentUser && m.uid===currentUser.uid) queueMedalAnimation(m.medalId);
        }
      });
    }
    MEDAL_EARNED = next;
    render();
  }, err=>{ console.error(err); toast('Error leyendo medallas.'); }));
}
function unsubscribeData(){
  unsubs.forEach(u=>u());
  unsubs = [];
  PROFILES = {}; LIFTS = []; BW_HISTORY = []; REACTIONS = []; COMMENTS = []; MEDAL_EARNED = [];
  seenMedalDocIds = null;
  profilesLoaded = false;
}
async function checkAndAwardMedals(){
  if(!currentUser) return;
  const uid = currentUser.uid;
  const ctx = medalContext(uid);
  for(const medal of MEDALS){
    const already = MEDAL_EARNED.some(m=>m.uid===uid && m.medalId===medal.id);
    if(already) continue;
    try{
      if(medal.check(ctx)){
        await db.collection('medals').doc(`${uid}_${medal.id}`).set({uid, medalId:medal.id, ts:Date.now()});
      }
    }catch(e){ console.error(e); }
  }
}
function queueMedalAnimation(medalId){
  medalAnimQueue.push(medalId);
  processMedalAnimQueue();
}
function processMedalAnimQueue(){
  if(medalAnimShowing || !medalAnimQueue.length) return;
  medalAnimShowing = true;
  const medalId = medalAnimQueue.shift();
  const medal = MEDALS.find(m=>m.id===medalId);
  if(!medal){ medalAnimShowing = false; processMedalAnimQueue(); return; }
  const overlay = document.getElementById('medalOverlay');
  overlay.innerHTML = `
    <div class="medal-pop">
      <div class="medal-icon">${medal.emoji}</div>
      <h3>¡Medalla desbloqueada!</h3>
      <div class="medal-name">${esc(medal.name)}</div>
      <div class="medal-desc">${esc(medal.desc)}</div>
    </div>
  `;
  overlay.classList.add('show');
  let closed = false;
  function close(){
    if(closed) return;
    closed = true;
    overlay.classList.remove('show');
    overlay.innerHTML = '';
    overlay.removeEventListener('click', close);
    medalAnimShowing = false;
    processMedalAnimQueue();
  }
  overlay.addEventListener('click', close);
  setTimeout(close, 3800);
}

function computeFeed(limit){
  const sorted = [...LIFTS].sort((a,b)=>a.ts-b.ts);
  const bestByUserEx = {};
  const bestByEx = {};
  const events = [];
  sorted.forEach(l=>{
    const ex = EXERCISES.find(e=>e.id===l.exercise);
    if(!ex) return;
    const bw = l.bw || (PROFILES[l.uid] && PROFILES[l.uid].bw);
    if(!bw) return;
    const ratio = userRatio(ex, l.weight, l.reps, bw, PROFILES[l.uid] && PROFILES[l.uid].sex);
    const keyUserEx = `${l.uid}|${ex.id}`;
    const prevPersonalBest = bestByUserEx[keyUserEx];
    const prevLeader = bestByEx[ex.id];
    const isPR = (prevPersonalBest===undefined) || ratio > prevPersonalBest;
    let type = 'normal', extraUid = null;
    if(isPR && prevLeader && prevLeader.uid !== l.uid && ratio > prevLeader.ratio){
      type = 'overtake';
      extraUid = prevLeader.uid;
    } else if(isPR && prevPersonalBest !== undefined){
      type = 'pr';
    }
    events.push({id:l.id, ts:l.ts, uid:l.uid, ex, ratio, weight:l.weight, reps:l.reps, type, extraUid});
    if(isPR) bestByUserEx[keyUserEx] = ratio;
    if(!prevLeader || ratio > prevLeader.ratio) bestByEx[ex.id] = {uid:l.uid, ratio};
  });
  return events.reverse().slice(0, limit);
}
function feedText(ev){
  const name = esc(displayName(ev.uid));

  if(ev.type==='overtake') return `👑 ${name} superó a ${esc(displayName(ev.extraUid))} en ${esc(ev.ex.name)} (${liftTxt})`;
  if(ev.type==='pr') return `🏅 ${name} batió su récord en ${esc(ev.ex.name)}: ${liftTxt}`;
  return `📋 ${name} registró ${liftTxt} en ${esc(ev.ex.name)}`;
}

function bestLift(uid, exId){
  const ex = EXERCISES.find(e=>e.id===exId);
  const lifts = LIFTS.filter(l=>l.uid===uid && l.exercise===exId);
  if(!lifts.length) return null;
  const bw = PROFILES[uid] && PROFILES[uid].bw;
  if(!bw) return null;
  const sex = PROFILES[uid] && PROFILES[uid].sex;
  let best = null, bestR = -Infinity;
  lifts.forEach(l=>{
    const r = userRatio(ex, l.weight, l.reps, l.bw || bw, sex);
    if(r > bestR){ bestR = r; best = l; }
  });
  return {lift:best, ratio:bestR};
}

      await createProfile(name, bw, isNaN(heightRaw)?null:heightRaw, sex);
    }catch(e){ console.error(e); toast('Error al guardar tu perfil.'); }
  });
}

function medalContext(uid){
  const lifts = LIFTS.filter(l=>l.uid===uid);
  function maxWeight(exId){
    const vals = lifts.filter(l=>l.exercise===exId).map(l=>l.weight);
    return vals.length ? Math.max(...vals) : 0;
  }
  function maxStrictReps(exId){
    const vals = lifts.filter(l=>l.exercise===exId && l.weight<=0).map(l=>l.reps);
    return vals.length ? Math.max(...vals) : 0;
  }
  return {maxWeight, maxStrictReps};
}

function hexToRgb(hex){ hex=hex.replace('#',''); return [parseInt(hex.substr(0,2),16),parseInt(hex.substr(2,2),16),parseInt(hex.substr(4,2),16)]; }
function rgbToHex(rgb){ return '#'+rgb.map(v=>Math.round(Math.max(0,Math.min(255,v))).toString(16).padStart(2,'0')).join(''); }
function lerpColor(hexA,hexB,t){ const a=hexToRgb(hexA), b=hexToRgb(hexB); return rgbToHex(a.map((v,i)=>v+(b[i]-v)*t)); }
function heatColor(intensity){
  if(intensity==null) return null;
  const t = Math.max(0, Math.min(1, intensity));
  return t<0.5 ? lerpColor('#eab308','#f97316', t/0.5) : lerpColor('#f97316','#dc2626', (t-0.5)/0.5);
}
function dateKey(ts){
  const d = new Date(ts);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function computeDailyActivity(uid){
  const map = {};
  LIFTS.filter(l=>l.uid===uid).forEach(l=>{
    const key = dateKey(l.ts);
    map[key] = (map[key]||0)+1;
  });
  return map;
}
function renderActivityCalendar(uid){
  if(CAL_MONTH_KEY !== uid){
    const now = new Date();
    CAL_YEAR = now.getFullYear();
    CAL_MONTHNUM = now.getMonth();
    CAL_MONTH_KEY = uid;
  }
  const activity = computeDailyActivity(uid);
  const year = CAL_YEAR, monthNum = CAL_MONTHNUM;
  const firstDay = new Date(year, monthNum, 1);
  const daysInMonth = new Date(year, monthNum+1, 0).getDate();
  const startOffset = (firstDay.getDay()+6)%7; // 0=lunes
  const monthLabel = firstDay.toLocaleDateString('es-ES', {month:'long', year:'numeric'});
  const today = new Date(); today.setHours(0,0,0,0);

  let maxCount = 0;
  Object.values(activity).forEach(c=>{ if(c>maxCount) maxCount=c; });
  function colorFor(count){
    if(!count) return 'var(--surface2)';
    const t = Math.min(1, count/Math.max(3,maxCount));
    return lerpColor('#4a3418','#E8402C', t);
  }

  const dayLabels = ['L','M','X','J','V','S','D'];
  let headerCells = dayLabels.map(d=>`<div class="cal-daylabel">${d}</div>`).join('');

  let dayCells = '';
  for(let i=0;i<startOffset;i++) dayCells += `<div class="cal-daycell empty"></div>`;
  let activeDaysThisMonth = 0;
  for(let day=1; day<=daysInMonth; day++){
    const cellDate = new Date(year, monthNum, day);
    const key = dateKey(cellDate.getTime());
    const count = activity[key]||0;
    if(count>0) activeDaysThisMonth++;
    const isFuture = cellDate > today;
    const isToday = cellDate.getTime()===today.getTime();
    const dateLabel = cellDate.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});
    dayCells += `<div class="cal-daycell${isToday?' today':''}" style="background:${isFuture?'transparent':colorFor(count)};" title="${dateLabel}: ${count} marca${count===1?'':'s'}">${day}</div>`;
  }

  return `<div class="card">
    <div class="ex-head">
      <h3 style="margin:0;font-size:14px;">📅 Calendario de actividad</h3>
      <div style="display:flex;align-items:center;gap:8px;">
        <button class="cal-nav" data-cal-nav="-1" aria-label="Mes anterior">‹</button>
        <span style="font-size:12px;color:var(--muted);text-transform:capitalize;min-width:100px;text-align:center;">${monthLabel}</span>
        <button class="cal-nav" data-cal-nav="1" aria-label="Mes siguiente">›</button>
      </div>
    </div>
    <div class="cal-month-grid" style="margin-top:10px;">${headerCells}${dayCells}</div>
    <div style="font-size:11.5px;color:var(--muted);margin-top:8px;">${activeDaysThisMonth} días activos este mes</div>
  </div>`;
}

    const file = new File([blob], 'ranking-hierro.png', {type:'image/png'});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Ranking de Hierro', text:shareText});
      }catch(e){ /* cancelado por el usuario */ }
    } else {
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'ranking-hierro.png';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast('Imagen descargada — compártela desde tu galería.');
    }
  }, 'image/png');
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '', lines = [];
  words.forEach(word=>{
    const test = line+word+' ';
    if(ctx.measureText(test).width > maxWidth && line){ lines.push(line); line = word+' '; }
    else line = test;
  });
  lines.push(line);
  lines.forEach((l,i)=> ctx.fillText(l.trim(), x, y+i*lineHeight));
  return lines.length;
}
function drawCardFrame(ctx, w, h, title){
  const grad = ctx.createLinearGradient(0,0,0,h);
  grad.addColorStop(0,'#242118'); grad.addColorStop(1,'#121214');
  ctx.fillStyle = grad; ctx.fillRect(0,0,w,h);
  ctx.strokeStyle = '#E3B341'; ctx.lineWidth = 6; ctx.strokeRect(3,3,w-6,h-6);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#E8402C'; ctx.font = 'bold 22px sans-serif';
  ctx.fillText(title, w/2, 50);
}
function feedBodyTextPlain(ev){ return feedBodyText(ev).replace(/<\/?b>/g,''); }

function buildFeedShareCanvas(ev, callback){

function levelLabelFromAvg(avg){
  if(avg==null) return 'Sin datos';
  const idx = Math.max(0, Math.min(4, Math.round(avg)-1));
  return TIER_NAMES[idx];
}
function computeMuscleGroups(uid){
  const result = {};
  const sex = PROFILES[uid] && PROFILES[uid].sex;
  Object.keys(MUSCLE_GROUPS).forEach(key=>{
    let sum=0, count=0;
    MUSCLE_GROUPS[key].forEach(exId=>{
      const ex = EXERCISES.find(e=>e.id===exId);
      if(!ex) return;
      const b = bestLift(uid, exId);
      if(b){ sum += (levelFor(ex,b.ratio,sex)+1); count++; }
    });
    result[key] = {
      count,
      avgLevel: count ? sum/count : null,
      intensity: count ? Math.max(0, Math.min(1, (sum/count - 1)/4)) : null
    };
  });
  return result;
}
function categoryAvgLevel(uid, cat){
  const sex = PROFILES[uid] && PROFILES[uid].sex;
  let sum=0, count=0;
  EXERCISES.filter(ex=>CATEGORY_OF[ex.id]===cat).forEach(ex=>{
    const b = bestLift(uid, ex.id);
    if(b){ sum += (levelFor(ex,b.ratio,sex)+1); count++; }
  });
  return count ? sum/count : null;
}

function generateRecommendations(uid){
  const recs = [];
  const sex = PROFILES[uid] && PROFILES[uid].sex;

  // 1) Zona muscular sin entrenar o más débil
  const groups = computeMuscleGroups(uid);
  const untrained = Object.keys(groups).filter(k=>groups[k].count===0);
  if(untrained.length){
    recs.push({icon:'🧩', text:`Aún no has entrenado ${GROUP_LABELS[untrained[0]]} — prueba a añadir algún ejercicio de esa zona.`});
  } else {
    let worstKey=null, worstVal=Infinity;
    Object.keys(groups).forEach(k=>{ if(groups[k].avgLevel!=null && groups[k].avgLevel<worstVal){ worstVal=groups[k].avgLevel; worstKey=k; } });
    if(worstKey && worstVal < 3){
      recs.push({icon:'🧩', text:`${GROUP_LABELS[worstKey]} es tu zona más débil ahora mismo (${levelLabelFromAvg(worstVal)}) — dale prioridad esta semana.`});
    }
  }

  // 2) Desequilibrio empuje/tirón
  const empuje = categoryAvgLevel(uid,'Empuje');
  const tiron = categoryAvgLevel(uid,'Tirón');
  if(empuje!=null && tiron!=null && Math.abs(empuje-tiron) >= 1){
    if(empuje > tiron) recs.push({icon:'⚖️', text:'Tu empuje (pecho/hombro) va más avanzado que tu tirón (espalda/bíceps) — meter más remo y dominadas ayuda a equilibrar hombros y postura.'});
    else recs.push({icon:'⚖️', text:'Tu tirón va más avanzado que tu empuje — puedes sumar más press banca/militar para equilibrar.'});
  }

  // 3) Ejercicio más cerca de subir de nivel
  let closest = null;
  EXERCISES.forEach(ex=>{
    const b = bestLift(uid, ex.id);
    if(!b) return;
    const idx = levelFor(ex, b.ratio, sex);
    if(idx>=4) return;
    const tiers = tiersFor(ex, sex);
    const nextRatio = tierRatio(ex, tiers[idx+1], sex);
    const prevRatio = idx>=0 ? tierRatio(ex, tiers[idx], sex) : 0;
    const range = (nextRatio-prevRatio) || 1;
    const gapPct = 1 - Math.max(0, Math.min(1, (b.ratio-prevRatio)/range));
    if(!closest || gapPct < closest.gapPct) closest = {ex, idx, gapPct};
  });
  if(closest && closest.gapPct < 0.3){
    const nt = tiersFor(closest.ex, sex)[closest.idx+1];
    recs.push({icon:'🎯', text:`Estás muy cerca de subir a ${nt.name} en ${closest.ex.name} — un empujón más y lo consigues.`});
  }

  // 4) Favorito abandonado
  const favs = (PROFILES[uid].favorites)||[];
  const now = Date.now();
  let stalest = null;
  favs.forEach(exId=>{
    const entries = LIFTS.filter(l=>l.uid===uid && l.exercise===exId);
    if(!entries.length) return;
    const lastTs = Math.max(...entries.map(l=>l.ts));
    const days = Math.floor((now-lastTs)/86400000);
    if(days>=21 && (!stalest || days>stalest.days)) stalest = {exId, days};
  });
  if(stalest){
    const ex = EXERCISES.find(e=>e.id===stalest.exId);
    recs.push({icon:'⏰', text:`Llevas ${stalest.days} días sin registrar ${ex.name} (uno de tus favoritos) — quizá toca retomarlo.`});
  }

  // 5) NGU incompleto
  const ngu = computeNGU(uid);
  if(ngu.count<4){
    recs.push({icon:'🏆', text:`Te falta registrar ${ngu.missing.join(', ')} para calcular tu Nivel Global (NGU).`});
  }

  // 6) Medalla más cercana
  const ctx = medalContext(uid);
  const earnedIds = new Set(MEDAL_EARNED.filter(m=>m.uid===uid).map(m=>m.medalId));
  let closestMedal = null;
  Object.keys(MEDAL_PROGRESS_META).forEach(medalId=>{
    if(earnedIds.has(medalId)) return;
    const meta = MEDAL_PROGRESS_META[medalId];
    const current = meta.type==='weight' ? ctx.maxWeight(meta.exId) : ctx.maxStrictReps(meta.exId);
    const gap = meta.target - current;
    if(gap > 0 && (!closestMedal || gap < closestMedal.gap)) closestMedal = {medalId, gap, meta};
  });
  if(closestMedal){
    const medal = MEDALS.find(m=>m.id===closestMedal.medalId);
    const unit = closestMedal.meta.type==='weight' ? 'kg' : 'reps';
    recs.push({icon:'🥇', text:`Te faltan ${fmt(closestMedal.gap)} ${unit} para la medalla ${medal.emoji} ${medal.name} (${medal.desc}).`});
  }

  return recs.slice(0,5);
}

      <tr><td>NGU</td><td>${nguMe.count===4?fmt2(nguMe.ngu):'—'}</td><td>${nguOther.count===4?fmt2(nguOther.ngu):'—'}</td></tr>
    </table></div>
  </div>`;

  const allExIds = new Set([
    ...LIFTS.filter(l=>l.uid===meUid).map(l=>l.exercise),
    ...LIFTS.filter(l=>l.uid===otherUid).map(l=>l.exercise)
  ]);

      const meTxt = bMe ? `${liftText(ex,bMe.lift.weight,bMe.lift.reps)} (${ratioText(ex,bMe.ratio)})` : '—';
      const otherTxt = bOther ? `${liftText(ex,bOther.lift.weight,bOther.lift.reps)} (${ratioText(ex,bOther.ratio)})` : '—';

    const rows = Object.keys(PROFILES).map(uid=>{
      const b = bestLift(uid, ex.id);
      if(!b) return null;
      const idx = levelFor(ex, b.ratio, PROFILES[uid].sex);
      return {uid, ratio:b.ratio, lift:b.lift, idx};
    }).filter(Boolean).sort((a,b)=>b.ratio-a.ratio);
    RANKING_ROWS_CACHE[ex.id] = rows;
    html += `<div class="card"><h3 style="margin:0 0 8px;font-size:14px;">${ex.name}</h3>`;
    if(!rows.length){
      html += `<div class="empty">Nadie ha registrado marca todavía.</div>`;
    } else {
      html += `<table><tr><th></th><th>Nombre</th><th>Marca</th><th>Nivel</th></tr>`;
      rows.forEach((r,i)=>{
        const liftTxt = liftText(ex, r.lift.weight, r.lift.reps);
        const lvlName = r.idx>=0?TIER_NAMES[r.idx]:'—';
        const lvlColor = r.idx>=0?TIER_COLORS[r.idx]:'var(--muted)';
        html += `<tr class="${r.uid===meUid?'you-row':''}"><td class="pos">${i+1}</td><td style="display:flex;align-items:center;gap:6px;cursor:pointer;" data-view-profile="${r.uid}">${avatarHTML(r.uid,20)}${esc(displayName(r.uid))}</td><td>${liftTxt}</td>
          <td><span class="badge" style="background:${lvlColor};color:#0d0d0e;">${lvlName}</span></td></tr>`;
      });
      html += `</table>
      <button class="hist-toggle" data-share-ranking="${ex.id}">📤 Compartir</button>`;
    }
    html += `</div>`;
  });

  html += `<div class="section-title">Clasificación general</div><div class="card">`;
  const general = Object.keys(PROFILES).map(uid=>{
    let sum=0, count=0, normSum=0;
    const sex = PROFILES[uid].sex;
    EXERCISES.forEach(ex=>{
      const b = bestLift(uid, ex.id);
      if(b){
        sum += (levelFor(ex,b.ratio,sex)+1);
        normSum += Math.min(Math.max(b.ratio/maxScale(ex,sex), 0), 1);
        count++;
      }
    });
    return {uid, avg: count? sum/count : 0, count, normAvg: count? normSum/count : 0};
  }).filter(g=>g.count>0).sort((a,b)=>b.avg-a.avg || b.count-a.count || b.normAvg-a.normAvg);
  if(!general.length){
    html += `<div class="empty">Aún no hay marcas registradas por nadie.</div>`;
  } else {
    general.forEach((g,i)=>{
      html += `<div class="rank-row ${g.uid===meUid?'you-row':''}">${avatarHTML(g.uid,24)}<div class="rank-pos">${i+1}</div>
        <div class="rank-name" data-view-profile="${g.uid}" style="cursor:pointer;">${esc(displayName(g.uid))}</div>
        <div class="rank-avg">Nivel medio ${fmt(g.avg)}/5 · ${g.count} ejerc. · ${fmt(g.normAvg*100)}% progreso medio</div></div>`;
    });
  }
  html += `</div>`;
  return html;
}

function bindDashboard(){
  document.querySelectorAll('[data-view-profile]').forEach(el=>{
    el.addEventListener('click', ()=>{
      VIEW_PROFILE_UID = el.dataset.viewProfile;
      COMPARE_PROFILE_ACTIVE = false;
      render();
    });
  });

  const exSelect = document.getElementById('exSelect');
  const weightLabel = document.getElementById('weightLabel');
  const repsGroup = document.getElementById('repsGroup');
  function updateLabel(){
    const ex = EXERCISES.find(e=>e.id===exSelect.value);
    repsGroup.style.display = ex.hideReps ? 'none' : '';
    if(ex.inputLabel){ weightLabel.textContent = ex.inputLabel; return; }
    weightLabel.textContent = ex.type==='bodyweight' ? 'Peso añadido (kg, 0 si es a peso corporal)' : 'Peso levantado (kg)';
  }
  exSelect.addEventListener('change', updateLabel);
  updateLabel();

  document.getElementById('saveLiftBtn').addEventListener('click', async ()=>{
    const exId = exSelect.value;
    const ex = EXERCISES.find(e=>e.id===exId);
    const weight = parseFloat(document.getElementById('weightInput').value);
    const reps = ex.hideReps ? 1 : parseInt(document.getElementById('repsInput').value);
    const note = document.getElementById('noteInput').value.trim();
    if(isNaN(weight) || weight<0){ toast('Introduce un peso válido.'); return; }
    if(!reps || reps<1){ toast('Introduce las repeticiones.'); return; }
    try{
      await saveLift(exId, weight, reps, note);
      document.getElementById('weightInput').value='';
      document.getElementById('repsInput').value='';
      document.getElementById('noteInput').value='';
      toast('Marca guardada.');
    }catch(e){ console.error(e); toast('Error al guardar la marca.'); }
  });

  document.getElementById('myProfileBtn').addEventListener('click', ()=>{
    VIEW_PROFILE_UID = currentUser.uid;
    COMPARE_PROFILE_ACTIVE = false;
    render();
  });

  document.getElementById('exportCsvBtn').addEventListener('click', ()=>{
    if(!LIFTS.some(l=>l.uid===currentUser.uid)){ toast('Aún no tienes marcas para exportar.'); return; }
    exportCSV();
  });
  document.getElementById('exportPdfBtn').addEventListener('click', ()=>{
    if(!LIFTS.some(l=>l.uid===currentUser.uid)){ toast('Aún no tienes marcas para exportar.'); return; }
    exportPDF();
  });

  document.getElementById('signOutBtn').addEventListener('click', ()=> auth.signOut());

  document.getElementById('editBw').addEventListener('click', openEditProfileModal);

  document.getElementById('clearMine').addEventListener('click', async ()=>{
    const res = await showModal({title:'Borrar tus marcas', message:'¿Seguro que quieres borrar todas tus marcas registradas? Esta acción no se puede deshacer.', confirmText:'Borrar'});
    if(!res.confirmed) return;
    try{ await clearMyLifts(); }catch(e){ console.error(e); toast('Error al borrar tus marcas.'); }
  });

  document.querySelectorAll('[data-tab]').forEach(b=>{
    b.addEventListener('click', ()=>{
      TAB = b.dataset.tab;
      render();
    });
  });

  renderTabContent();
}

function renderTabContent(){
  const html = TAB==='perfil' ? renderPerfilTab() : TAB==='ranking' ? renderRankingTab() : renderFeedTab();
  document.getElementById('tabContent').innerHTML = html;

  document.querySelectorAll('[data-view-profile]').forEach(el=>{
    el.addEventListener('click', ()=>{
      VIEW_PROFILE_UID = el.dataset.viewProfile;
      COMPARE_PROFILE_ACTIVE = false;
      render();
    });
  });

  document.querySelectorAll('[data-react]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const [liftId, emoji] = b.dataset.react.split('|');
      try{ await toggleReaction(liftId, emoji); }catch(e){ console.error(e); toast('Error al reaccionar.'); }
    });
  });

  document.querySelectorAll('[data-toggle-comments]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const id = b.dataset.toggleComments;
      if(FEED_OPEN_COMMENTS.has(id)) FEED_OPEN_COMMENTS.delete(id); else FEED_OPEN_COMMENTS.add(id);
      renderTabContent();
    });
  });

  document.querySelectorAll('[data-share-feed]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const ev = FEED_EVENTS_CACHE[b.dataset.shareFeed];
      if(ev) shareFeedCard(ev);
    });
  });

  document.querySelectorAll('[data-share-ranking]').forEach(b=>{
    b.addEventListener('click', ()=>{
      shareRankingCard(b.dataset.shareRanking);
    });
  });

  document.querySelectorAll('[data-send-comment]').forEach(b=>{
    const send = async ()=>{
      const liftId = b.dataset.sendComment;
      const input = document.querySelector(`[data-comment-input="${liftId}"]`);
      const text = input.value.trim();
      if(!text) return;
      try{
        await addComment(liftId, text);
        input.value = '';
      }catch(e){ console.error(e); toast('Error al enviar el comentario.'); }
    };
    b.addEventListener('click', send);
    const input = document.querySelector(`[data-comment-input="${b.dataset.sendComment}"]`);
    if(input) input.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); send(); } });
  });

  document.querySelectorAll('[data-del-comment]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const res = await showModal({title:'Borrar comentario', message:'¿Borrar este comentario?', confirmText:'Borrar'});
      if(!res.confirmed) return;
      try{ await deleteComment(b.dataset.delComment); }catch(e){ console.error(e); toast('Error al borrar el comentario.'); }
    });
  });

  document.querySelectorAll('[data-del-entry]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const res = await showModal({title:'Borrar entrada', message:'¿Borrar esta entrada del historial? Esta acción no se puede deshacer.', confirmText:'Borrar'});
      if(!res.confirmed) return;
      try{ await deleteLift(b.dataset.delEntry); }catch(e){ console.error(e); toast('Error al borrar la entrada.'); }
    });
  });

  document.querySelectorAll('[data-toggle-perfil]').forEach(el=>{
    el.addEventListener('click', ()=>{
      const id = el.dataset.togglePerfil;
      if(PERFIL_EXPANDED.has(id)) PERFIL_EXPANDED.delete(id); else PERFIL_EXPANDED.add(id);
      renderTabContent();
    });
  });

  document.querySelectorAll('[data-compare-ex]').forEach(sel=>{
    sel.addEventListener('change', ()=>{
      COMPARE_SELECTIONS[sel.dataset.compareEx] = sel.value || null;
      renderTabContent();
    });
  });

  document.querySelectorAll('[data-fav]').forEach(b=>{
    b.addEventListener('click', async (e)=>{
      e.stopPropagation();
      try{ await toggleFavorite(b.dataset.fav); }catch(err){ console.error(err); toast('Error al actualizar favorito.'); }
    });
  });

  document.querySelectorAll('[data-del-bw]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const res = await showModal({title:'Borrar entrada', message:'¿Borrar este registro de peso corporal? Esta acción no se puede deshacer.', confirmText:'Borrar'});
      if(!res.confirmed) return;
      try{ await deleteBwEntry(b.dataset.delBw); }catch(e){ console.error(e); toast('Error al borrar la entrada.'); }
    });
  });

  document.querySelectorAll('[data-cat]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const [scope, cat] = b.dataset.cat.split(':');
      if(scope==='perfil') PERFIL_CAT = cat;
      if(scope==='ranking') RANKING_CAT = cat;
      renderTabContent();
    });
  });
}

async function openChangePhotoModal(){
  const cur = PROFILES[currentUser.uid].photoURL || '';
  const res = await showModal({title:'Cambiar foto', message:'Pega el enlace directo a una imagen (debe empezar por http:// o https://).', showInput:true, inputType:'text', inputLabel:'URL de la imagen', inputValue:cur, confirmText:'Guardar'});
  if(!res.confirmed) return;
  const url = (res.value||'').trim();
  if(url && !/^https?:\/\//.test(url)){ toast('La URL debe empezar por http:// o https://'); return; }
  try{ await updatePhoto(url); }catch(e){ console.error(e); toast('Error al actualizar la foto.'); }
}

function openEditProfileModal(){
  const overlay = document.getElementById('modalOverlay');
  const p = PROFILES[currentUser.uid];
  overlay.innerHTML = `
    <div class="modal-box">
      <h3>Editar perfil</h3>
      <label>Peso corporal (kg)</label>
      <input type="number" step="0.1" id="editBwInput" value="${p.bw}" />
      <div style="margin-top:10px;">
        <label>Altura (cm)</label>
        <input type="number" step="0.5" id="editHeightInput" value="${p.height!=null?p.height:''}" placeholder="Ej: 178" />
      </div>
      <div style="margin-top:10px;">
        <label>Sexo</label>
        <select id="editSexInput">
          <option value="">Prefiero no decirlo</option>
          <option value="Hombre" ${p.sex==='Hombre'?'selected':''}>Hombre</option>
          <option value="Mujer" ${p.sex==='Mujer'?'selected':''}>Mujer</option>
          <option value="Otro" ${p.sex==='Otro'?'selected':''}>Otro</option>
        </select>
      </div>
      <div class="empty" id="editProfileErr" style="margin-top:6px;"></div>
      <div class="modal-actions">
        <button class="ghost" id="editProfileCancel">Cancelar</button>
        <button id="editProfileSave">Guardar</button>
      </div>
    </div>
  `;
  overlay.classList.add('show');
  function close(){ overlay.classList.remove('show'); overlay.innerHTML=''; }
  document.getElementById('editProfileCancel').addEventListener('click', close);
  overlay.addEventListener('click', (e)=>{ if(e.target===overlay) close(); }, {once:true});
  document.getElementById('editProfileSave').addEventListener('click', async ()=>{
    const err = document.getElementById('editProfileErr');
    const n = parseFloat(document.getElementById('editBwInput').value);
    const h = parseFloat(document.getElementById('editHeightInput').value);
    const sex = document.getElementById('editSexInput').value;
    if(!n || n<=0){ err.textContent = 'Peso no válido.'; return; }
    try{
      await updateProfileDetails(n, isNaN(h)?null:h, sex);
      close();
      toast('Perfil actualizado.');
    }catch(e){ console.error(e); err.textContent = 'Error al guardar.'; }
  });
}

function showModal(opts){
  return new Promise(resolve=>{
    const overlay = document.getElementById('modalOverlay');
    overlay.innerHTML = `
      <div class="modal-box">
        <h3>${esc(opts.title||'')}</h3>
        ${opts.message?`<p>${esc(opts.message)}</p>`:''}
        ${opts.showInput?`<label>${esc(opts.inputLabel||'')}</label><input id="modalInput" type="${opts.inputType||'text'}" step="${opts.inputStep||'any'}" value="${opts.inputValue!=null?esc(String(opts.inputValue)):''}" />`:''}
        <div class="modal-actions">
          <button class="ghost" id="modalCancel">${esc(opts.cancelText||'Cancelar')}</button>
          <button id="modalConfirm">${esc(opts.confirmText||'Aceptar')}</button>
        </div>
      </div>
    `;
    overlay.classList.add('show');
    const input = document.getElementById('modalInput');
    if(input){ input.focus(); input.select(); }
    function cleanup(result){
      overlay.classList.remove('show');
      overlay.innerHTML = '';
      resolve(result);
    }
    document.getElementById('modalCancel').addEventListener('click', ()=>cleanup({confirmed:false}));
    document.getElementById('modalConfirm').addEventListener('click', ()=>{
      cleanup({confirmed:true, value: input ? input.value : null});
    });
    overlay.addEventListener('click', (e)=>{ if(e.target===overlay) cleanup({confirmed:false}); }, {once:true});
    if(input){
      input.addEventListener('keydown', e=>{
        if(e.key==='Enter'){ e.preventDefault(); document.getElementById('modalConfirm').click(); }
      });
    }
  });
}

render();

})();
</script>
